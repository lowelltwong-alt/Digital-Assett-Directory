name: Albert CI Contract Scoping

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "simulation/validate_simulation_red_team_ci.py"
      - "tests/test_ci_module_path_scoping.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-contracts:
    name: Module-scoped workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate simulator workflow contract
        run: python simulation/validate_simulation_red_team_ci.py

      - name: Validate cross-module CI path boundaries
        run: python -m unittest tests.test_ci_module_path_scoping

