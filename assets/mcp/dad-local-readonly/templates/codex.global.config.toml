[mcp_servers.dad-local-graph-surfaces]
command = "{{DAD_PYTHON}}"
args = ["-m", "digital_asset_directory.cli", "mcp", "graph-stdio", "--hub", "{{DAD_HUB}}"]
enabled = true
required = false
enabled_tools = ["dad_graph_surface_status", "dad_graph_get_node", "dad_graph_neighbors", "dad_graph_search_nodes", "dad_mcp_dependency_status", "dad_mcp_dependency_impact", "dad_mcp_dependency_refresh_candidate", "dad_lifecycle_packet_prepare", "dad_recovery_packet_prepare", "dad_lifecycle_result_record", "dad_recovery_result_record"]
default_tools_approval_mode = "prompt"
