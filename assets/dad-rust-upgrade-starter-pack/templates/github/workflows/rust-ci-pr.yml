name: rust-ci-pr

on:
  pull_request:
    paths:
      - "tools/dad_scan_core/**"
      - "scripts/run_dad_scan_core.py"
      - "docs/rust/**"
      - ".github/workflows/rust-ci-pr.yml"
  push:
    branches: [ main ]
    paths:
      - "tools/dad_scan_core/**"
      - "scripts/run_dad_scan_core.py"
      - "docs/rust/**"
      - ".github/workflows/rust-ci-pr.yml"

jobs:
  rust-pr:
    name: rust-pr-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ""
      - name: cargo fmt
        run: cargo fmt --manifest-path tools/dad_scan_core/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path tools/dad_scan_core/Cargo.toml --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path tools/dad_scan_core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python wrapper help
        run: python scripts/run_dad_scan_core.py --help
