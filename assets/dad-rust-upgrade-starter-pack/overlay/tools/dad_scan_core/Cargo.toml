[package]
name = "dad_scan_core"
version = "0.1.0"
edition = "2024"
description = "Deterministic local source scanner for Digital Asset Directory"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
