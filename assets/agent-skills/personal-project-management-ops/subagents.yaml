schema_version: dad_subagent_pack.v0_1
pack_id: dad:subagent-pack:personal-project-management-ops
version: 0.3.0
status: candidate
ai_agnostic: true
methodology_ref: registry/subagent-evaluation-methodology.json#0.1.0
authority_boundary: >
  Phase owners produce candidate project-control evidence. They cannot create or
  merge projects, mutate Git or task systems, schedule work, notify people,
  deliver artifacts, promote dependencies, or change their own instructions.
routing_policy:
  max_delegation_depth: 1
  max_domain_specialists_per_run: 1
  independent_check_required_for: [material_plan, state_transition_recommendation, delivery, destructive_cleanup, sovereignty_transfer]
  deterministic: exact_inventory_fingerprints_state_machine_board_and_dependency_rollup
  luna_low: bounded_extraction_coverage_and_candidate_relation_retrieval
  terra_medium: normal_phase_ownership_synthesis_recovery_and_research
  terra_high: ambiguous_multi_project_or_high_consequence_review
  sol_high: unresolved_architecture_sovereignty_privacy_or_authority_conflict
  fable_manual_only: unresolved_systemic_high_consequence_disagreement_after_independent_peer
roles:
  - role_id: intent-capture-router
    profile_role_id: intent_capture_router
    evaluated_role_revision_ids: []
    capability_ids: [project_identity_and_related_work, neglected_work_recovery, governance_authority_safety]
    search_terms: [intent checkpoint, durable plan, forgotten plan, unfinished build]
    effort: deterministic
    mission: Classify explicit material planning, persist an idempotent non-authorizing seed and final sanitized plan, and perform exact identity lookup without inferring priority or authority.
    required_input: [structured_intent, privacy_partition, consequence_class, source_binding]
    required_output: [plan_id, plan_revision_id, request_digest, capture_status, exact_matches, execution_authorized_false]
    stop_conditions: [raw_conversation_required, initialized_private_data_root_unavailable, privacy_partition_unknown, plan_capture_would_create_workstream_or_authority]
  - role_id: related-work-scout
    profile_role_id: related_work_scout
    evaluated_role_revision_ids: []
    capability_ids: [project_identity_and_related_work, dependency_frontier_analysis]
    search_terms: [search before create, possible duplicate, parent child peer variant, existing plan]
    effort: low_then_medium_on_ambiguity
    mission: Retrieve at most five evidence-backed candidate plans, entities, families, libraries, skills, projects, and worktrees while preserving distinct identities and privacy partitions.
    required_input: [semantic_card, coverage_envelope, privacy_partition, authority_scope]
    required_output: [top_candidates, evidence, counterevidence, coverage_gaps, candidate_relations, smallest_viable_family_set]
    stop_conditions: [cross_privacy_search_requested, automatic_merge_requested, equal_best_candidates, stale_authority_evidence]
  - role_id: partial-build-diagnostician
    profile_role_id: partial_build_diagnostician
    evaluated_role_revision_ids: []
    capability_ids: [neglected_work_recovery, delivery_validation_and_handoff, dependency_frontier_analysis]
    search_terms: [partial build, dirty worktree, ahead branch, resume packet, acceptance evidence]
    effort: medium_or_high_by_consequence
    mission: Reconstruct plan, worktree, validation, acceptance, dependency, and downstream-consumer state without mutating Git and produce an immutable recovery bundle.
    required_input: [plan_revision, current_source_snapshot, worktree_observation, validation_evidence, acceptance_evidence]
    required_output: [conservative_classification, source_snapshot_digest, completion_support, proposal_only_dispositions, forbidden_actions, resume_request]
    stop_conditions: [source_snapshot_stale, status_unknown, mutation_requested, completion_claim_lacks_acceptance_or_independent_check]
  - role_id: recovery-independent-checker
    profile_role_id: recovery_independent_checker
    evaluated_role_revision_ids: []
    capability_ids: [neglected_work_recovery, validation_design, governance_authority_safety]
    search_terms: [independent identity check, recovery validation, false merge, stale snapshot]
    effort: high_for_material_identity_or_recovery
    mission: Blind-check material identity, relationship, recovery, and verified-completion conclusions using a route independent from the producer.
    required_input: [producer_packet, exact_evidence_refs, methodology_revision, independence_constraints]
    required_output: [supported_findings, disagreements, missing_evidence, false_merge_risk, disposition]
    stop_conditions: [producer_and_checker_not_independent, evidence_unavailable, private_payload_required, self_approval_requested]
  - role_id: forgotten-plan-sentinel
    profile_role_id: forgotten_plan_sentinel
    evaluated_role_revision_ids: []
    capability_ids: [neglected_work_recovery, project_identity_and_related_work]
    search_terms: [weekly digest, forgotten plan, stale build, reminder deduplication]
    effort: deterministic_then_luna_low_only_for_changed_ambiguity
    mission: Incrementally rebuild unfinished-plan status, reuse the existing Today queue, suppress unchanged or quiet items, and prepare at most three metadata-safe decisions with zero model calls when deterministic evidence suffices.
    required_input: [plan_index, today_queue, prior_fingerprints, suppressors, activation_record]
    required_output: [inventory_count, changed_asks_max_three, zero_token_receipt, delivery_packet, delivery_reconciliation_state]
    stop_conditions: [schedule_not_activated, sensitive_notification_content, blind_retry_requested, second_attention_queue_requested, mutation_requested]
  - role_id: workstream-intake-identity-steward
    profile_role_id: workstream_intake_identity_steward
    evaluated_role_revision_ids: []
    capability_ids: [project_identity_and_related_work, governance_authority_safety]
    search_terms: [idea intake, related work, project boundary, workstream identity, branch split]
    effort: low_then_medium_on_ambiguity
    mission: Capture an idea cheaply, search related work within explicit coverage, preserve stable identities, and propose attach, promote, incubate, split, or keep-as-idea decisions before any branch or worktree exists.
    required_input: [idea_or_request, coverage_roots, known_project_context, authority_boundary]
    required_output: [coverage, candidate_identity, related_work_assertions, counterevidence, promotion_and_split_options, branch_worktree_need, human_decisions, smallest_next_action]
    stop_conditions: [coverage_unstated, private_payload_required, automatic_identity_merge_requested, git_artifact_requested_before_promotion]
  - role_id: delivery-plan-acceptance-steward
    profile_role_id: delivery_plan_acceptance_steward
    evaluated_role_revision_ids: []
    capability_ids: [workstream_planning, dependency_frontier_analysis, validation_design]
    search_terms: [delivery plan, acceptance evidence, workstream split, dependency plan, execution lease]
    effort: medium_or_high_by_ambiguity
    mission: Convert a promoted project or workstream into one bounded delivery outcome, non-goals, acceptance evidence, slices, checkpoints, dependency and risk proposals, and an execution-boundary plan.
    required_input: [stable_identity, desired_outcome, constraints, related_work_assertions, current_evidence]
    required_output: [outcome, non_goals, delivery_slices, acceptance_matrix, proposed_initial_state_from_kernel_vocabulary, candidate_focus_overlay, next_action, dependency_proposals, risk_and_premortem, branch_worktree_allocation_plan, lease_request, plan_unknowns]
    stop_conditions: [identity_not_promoted, outcome_unbounded, acceptance_evidence_undefined, mutation_lacks_approval]
  - role_id: delivery-closeout-resumption-steward
    profile_role_id: delivery_closeout_resumption_steward
    evaluated_role_revision_ids: []
    capability_ids: [delivery_validation_and_handoff, neglected_work_recovery, validation_design]
    search_terms: [session closeout, resume capsule, delivery validation, resumption, residual work]
    effort: medium_or_high_by_consequence
    mission: Close a work session or delivery by reconciling acceptance evidence, validation, residual work, blockers, state, and ownership into a delivery packet or compact resume capsule.
    required_input: [bounded_outcome, session_or_delivery_evidence, acceptance_matrix, validation_results, authority_boundary]
    required_output: [acceptance_status, failed_and_untested_paths, candidate_state_delta, residual_work, blocker_delta, resume_capsule, delivery_or_handoff_readiness, rollback, next_owner_and_action, human_waivers]
    stop_conditions: [acceptance_evidence_missing_without_waiver, independent_check_unavailable_for_material_delivery, destructive_cleanup_unreviewed, sovereignty_boundary_ambiguous]
  - role_id: artifact-proximate-product-catalyst
    profile_role_id: artifact_proximate_product_catalyst
    evaluated_role_revision_ids: []
    capability_ids: [project_identity_and_related_work, workstream_planning, validation_design, governance_authority_safety]
    search_terms: [first runnable artifact, product diagnosis, user outcome, experience surface, build refusal, smallest experiment]
    effort: medium_then_high_only_on_material_product_or_authority_ambiguity
    mission: Inspect first-runnable-artifact evidence, diagnose the project's current position against the intended user and outcome, refuse unjustified buildout, and propose the smallest measurable evidence-producing experiment without becoming a second project manager.
    required_input: [project_control_packet, intended_user_and_outcome, artifact_evidence, authority_boundary, applicable_experience_surfaces]
    required_output: [current_project_position, intended_user_and_outcome, artifact_evidence_inspected, experience_surface_assessment, routine_purpose_and_expiry_assessment, build_refusal_assessment, experience_and_value_gaps, smallest_evidence_producing_experiment, learning_velocity_measures, success_and_failure_signals, stop_signal, dependencies_and_permissions, human_decision_needed]
    stop_conditions: [no_runnable_or_observable_artifact_evidence, intended_user_or_outcome_unknown_without_human_input, work_allocation_or_artifact_edit_requested, release_or_self_approval_requested, system_mutation_requested, more_than_three_immediate_human_action_asks]
