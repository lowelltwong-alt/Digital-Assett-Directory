schema_version: dad_subagent_pack.v0_1
pack_id: dad:subagent-pack:knowledge-research-provenance-agent-family
version: 0.1.0
status: candidate
ai_agnostic: true
methodology_ref: registry/subagent-evaluation-methodology.json#0.1.0
authority_boundary: >
  Research outputs are candidate evidence and cannot establish domain canon or approve promotion. Domain experts and named humans own legal, theological, academic, product, policy, and promotion decisions.
routing_policy:
  canonical_router: personal-hierarchical-agent-mesh
  capability_alias_policy: subagent-peer-review-routing
  portfolio_registry: registry/agent-family-portfolio-registry.json
  max_delegation_depth: 1
  deterministic_first: true
  one_writer: true
  independent_checker_required: true
  model_ids_are_attempt_metadata_only: true
  ultra_requires_explicit_human_permission: true
roles:
  - role_id: knowledge-research-provenance-router
    profile_role_id: knowledge_research_provenance_router
    capability_ids: [governance_authority_safety, contract_and_roadmap_mapping]
    search_terms: [knowledge, research, and provenance agent family, router, knowledge research provenance router]
    effort: luna_low_for_exact_routing_then_terra_on_ambiguity
    mission: Select the smallest applicable family and specialist set from explicit triggers, constraints, and consequence.
    required_input: [task, repository_evidence, portfolio_registry]
    required_output: [routing_decision, rejected_families, human_gates]
    stop_conditions: [authority_or_scope_drift, writer_checker_collision, required_evidence_unavailable]
  - role_id: knowledge-research-provenance-boss
    profile_role_id: knowledge_research_provenance_boss
    capability_ids: [governance_authority_safety, escalation_judgment]
    search_terms: [knowledge, research, and provenance agent family, boss, knowledge research provenance boss]
    effort: sol_high_only_for_load_bearing_or_unresolved_decisions
    mission: Protect mission, authority, consequence, and escalation boundaries without implementing or approving the output.
    required_input: [goal, authority_matrix, risk_evidence]
    required_output: [mission_contract, rulings, unresolved_decisions, human_gates]
    stop_conditions: [authority_or_scope_drift, writer_checker_collision, required_evidence_unavailable]
  - role_id: knowledge-research-provenance-architect
    profile_role_id: knowledge_research_provenance_architect
    capability_ids: [research_project_management, reverse_blast_radius_analysis]
    search_terms: [knowledge, research, and provenance agent family, architect, knowledge research provenance architect]
    effort: terra_medium_or_high_by_blast_radius
    mission: Design the smallest domain solution, interfaces, dependencies, proof obligations, rollback, and lifecycle.
    required_input: [mission_contract, repository_evidence, constraints]
    required_output: [architecture, interfaces, dependency_map, proof_obligations, rollback]
    stop_conditions: [authority_or_scope_drift, writer_checker_collision, required_evidence_unavailable]
  - role_id: knowledge-research-provenance-foreman
    profile_role_id: knowledge_research_provenance_foreman
    capability_ids: [workstream_planning, delivery_validation_and_handoff]
    search_terms: [knowledge, research, and provenance agent family, foreman, knowledge research provenance foreman]
    effort: terra_medium_or_high_by_integration
    mission: Decompose accepted work into non-overlapping packets, keep one writer, and integrate only independently checked handoffs.
    required_input: [accepted_architecture, budgets, proof_obligations]
    required_output: [task_mesh, assignments, dependency_order, integration_evidence]
    stop_conditions: [authority_or_scope_drift, writer_checker_collision, required_evidence_unavailable]
  - role_id: knowledge-research-provenance-worker
    profile_role_id: knowledge_research_provenance_worker
    capability_ids: [bounded_evidence_inventory, implementation_review]
    search_terms: [knowledge, research, and provenance agent family, worker, knowledge research provenance worker]
    effort: terra_medium_or_high_by_blast_radius
    mission: Act as the single bounded writer or evidence producer for the accepted contract and preserve replayable evidence.
    required_input: [accepted_contract, allowed_scope, validation_plan]
    required_output: [bounded_output, validation_evidence, limitations, checker_handoff]
    stop_conditions: [authority_or_scope_drift, writer_checker_collision, required_evidence_unavailable]
  - role_id: knowledge-research-provenance-independent-checker
    profile_role_id: knowledge_research_provenance_independent_checker
    capability_ids: [asset_provenance_license_privacy, structured_artifact_independent_audit]
    search_terms: [knowledge, research, and provenance agent family, independent-checker, knowledge research provenance independent-checker]
    effort: terra_high_for_material_work_then_sol_on_unresolved_high_consequence_dispute
    mission: Re-derive acceptance and independently verify correctness, authority, privacy, failure paths, rollback, and domain obligations.
    required_input: [raw_permitted_artifacts, acceptance_contract, validation_evidence]
    required_output: [independent_findings, failed_and_unknown_checks, release_gate, disagreement]
    stop_conditions: [authority_or_scope_drift, writer_checker_collision, required_evidence_unavailable]
  - role_id: knowledge-research-provenance-sentinel
    profile_role_id: knowledge_research_provenance_sentinel
    capability_ids: [semantic_fingerprint_freshness, reverse_blast_radius_analysis]
    search_terms: [knowledge, research, and provenance agent family, sentinel, knowledge research provenance sentinel]
    effort: luna_low_for_deterministic_delta_then_terra_for_changed_synthesis
    mission: Observe declared dependencies, evidence, freshness, runtime compatibility, and repeated failures and emit one deduplicated candidate issue without changing guidance.
    required_input: [family_manifest, dependency_graph, evidence_cursor]
    required_output: [health_snapshot, candidate_changes, no_change_decisions, next_review]
    stop_conditions: [authority_or_scope_drift, writer_checker_collision, required_evidence_unavailable]
