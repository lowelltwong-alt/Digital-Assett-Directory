project:
  name: Digital Asset Directory
  owner: lowelltwong-alt
  catalog_root: .
  database: state/catalog.sqlite3

sources:
  local:
    - id: git-projects
      enabled: true
      path: 'C:\Users\lowel\OneDrive\Desktop\Git Projects'
      path_alias: git-projects
      follow_symlinks: false
      max_file_bytes: 2000000
      excerpt_chars: 5000
      include_binary_metadata: true
      exclude:
        - '**/.git/**'
        - '**/.venv/**'
        - '**/venv/**'
        - '**/node_modules/**'
        - '**/dist/**'
        - '**/build/**'
        - '**/.next/**'
        - '**/coverage/**'
        - '**/__pycache__/**'
        - '**/.pytest_cache/**'
        - '**/.ruff_cache/**'
        - '**/.mypy_cache/**'
        - '**/.nox/**'
        - '**/.tox/**'
        - '**/.pytest-tmp-root/**'
        - '**/pytest-of-*/**'
        - '**/_codex_worktrees/**'
        - '**/.worktrees/**'
        - '.DS_Store'
        - '**/.DS_Store'
        - 'Thumbs.db'
        - '**/Thumbs.db'
        - 'desktop.ini'
        - '**/desktop.ini'
        - '**/.env'
        - '**/.env.*'
        - '**/*credential*'
        - '**/*secret*'
        - '**/*.pem'
        - '**/*.key'
        - '**/04_Digital_Assett_Directory/raw/**'
        - '**/04_Digital_Assett_Directory/processed/**'
        - '**/04_Digital_Assett_Directory/state/**'
        - '**/04_Digital_Assett_Directory/audit/**'

    - id: optional-whole-c-drive
      enabled: false
      path: 'C:/'
      path_alias: local-c-drive
      follow_symlinks: false
      max_file_bytes: 1000000
      excerpt_chars: 3000
      include_binary_metadata: true
      exclude:
        - '**/$Recycle.Bin/**'
        - '**/System Volume Information/**'
        - '**/Windows/**'
        - '**/Program Files/**'
        - '**/Program Files (x86)/**'
        - '**/ProgramData/**'
        - '**/AppData/**'
        - '**/.git/**'
        - '**/.venv/**'
        - '**/node_modules/**'
        - '**/.pytest_cache/**'
        - '**/.ruff_cache/**'
        - '**/.mypy_cache/**'
        - '**/.nox/**'
        - '**/.tox/**'
        - '**/.pytest-tmp-root/**'
        - '**/pytest-of-*/**'
        - '**/_codex_worktrees/**'
        - '**/.worktrees/**'
        - '.DS_Store'
        - '**/.DS_Store'
        - 'Thumbs.db'
        - '**/Thumbs.db'
        - 'desktop.ini'
        - '**/desktop.ini'
        - '**/.env*'
        - '**/*credential*'
        - '**/*secret*'
        - '**/*.pem'
        - '**/*.key'
        - '**/04_Digital_Assett_Directory/raw/**'
        - '**/04_Digital_Assett_Directory/processed/**'
        - '**/04_Digital_Assett_Directory/state/**'
        - '**/04_Digital_Assett_Directory/audit/**'

  github:
    - id: github-lowelltwong-alt
      enabled: false
      owner: lowelltwong-alt
      token_env: GITHUB_TOKEN
      include_private: true
      include_archived: true
      content_mode: priority
      max_file_bytes: 1000000
      priority_patterns:
        - 'README*'
        - 'AGENTS.md'
        - 'CLAUDE.md'
        - 'AI_*'
        - 'MACHINE_NAVIGATION_MANIFEST.json'
        - 'pyproject.toml'
        - 'package.json'
        - 'requirements*.txt'
        - 'registry/**'
        - 'schemas/**'
        - 'schema/**'
        - 'ontology/**'
        - 'governance/**'
        - 'docs/**/*.md'
        - '.github/workflows/**'

mail:
  repos:
    - id: dad
      path: .
      alias: dad
      visibility: internal
      public_facing: false
      mail_enabled: true
      delivery_allowed: true
    # Add reviewed downstream repos here before using `mail collect --repo all`
    # or `mail deliver --repo all`. Discovery reports candidates only; it does
    # not authorize delivery.
    # - id: example-public-repo
    #   path: 'C:\Users\lowel\OneDrive\Desktop\Git Projects\example-public-repo'
    #   alias: example-public
    #   visibility: public
    #   public_facing: true
    #   mail_enabled: true
    #   delivery_allowed: true

exceptions:
  repos:
    - id: dad
      path: .
      alias: dad
      visibility: internal
      public_facing: false
      exceptions_enabled: true
      collect_allowed: true
      capture_audit_allowed: true
      backfill_allowed: true
      approved_approval_ids: []
    # Add reviewed downstream repos here before using
    # `exceptions collect --repo all` or `exceptions capture-audit --repo all`.
    # Mail enrollment does not authorize exception collection.
    # - id: example-public-repo
    #   path: 'C:\Users\lowel\OneDrive\Desktop\Git Projects\example-public-repo'
    #   alias: example-public
    #   visibility: public
    #   public_facing: true
    #   exceptions_enabled: true
    #   collect_allowed: true
    #   capture_audit_allowed: true
    #   backfill_allowed: false
    #   approved_approval_ids: []

enrollment:
  repos:
    - id: dad
      path: .
      alias: dad
      visibility: internal
      public_facing: false
      enrollment_enabled: true
      apply_allowed: false
      update_allowed: false
      wave: dad-self
      approved_approval_ids: []
      local_paths_allowed: false
      repo_type: control_plane
      languages: [python]
      domains: [digital_asset_directory]
      context_tags: [dad_hub, control_plane, governance]
      validation_commands:
        - python -m pytest
        - python -m digital_asset_directory.cli validate
      enabled_control_planes:
        - dad_library
        - mail_center
        - reusable_assets
        - coding_harnesses
        - agent_skills
        - templates
        - architecture_references
        - repo_enrollment
        - coding_test_parity
        - governance_maps
        - data_maps
        - learning_postflight_loops
    # Add reviewed downstream repos here before using `enroll plan --repo all`
    # or `enroll apply`. Discovery reports candidates only; it does not
    # authorize governance installation.
    # - id: example-public-repo
    #   path: 'C:\Users\lowel\OneDrive\Desktop\Git Projects\example-public-repo'
    #   alias: example-public
    #   visibility: public
    #   public_facing: true
    #   enrollment_enabled: true
    #   apply_allowed: true
    #   update_allowed: true
    #   wave: wave-2026-07-reviewed
    #   approved_approval_ids: ['HUMAN-APPROVED-EXAMPLE']
    #   local_paths_allowed: false
    #   repo_type: application
    #   languages: [python, javascript]
    #   domains: [example]
    #   context_tags: [persistent_repo, public_safe]
    #   validation_commands:
    #     - python -m pytest

settings:
  read_only: true
  store_excerpts: true
  redact_sensitive_excerpts: true
  stale_days_default: 365
  stale_days_by_type:
    repository: 180
    code: 365
    schema: 540
    ontology: 730
    research: 365
    lesson: 1095
    decision: 1095
    workflow: 540
    evaluation: 365
  related_similarity_threshold: 0.34
  synergy_alert_threshold: 0.64
  high_value_threshold: 70
  orphan_degree_threshold: 1
  max_related_edges_per_asset: 20
  max_context_assets: 20
  skill_candidate_repeat_threshold: 3
