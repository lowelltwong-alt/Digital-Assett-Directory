notes:
  - Scores prioritize review and routing; they do not prove truth, quality, or business value.
  - Type bonuses are gated on direct evidence and source instance class.
  - Content-aware scoring uses bounded deterministic content profiles for code and workflow role signals.
  - Freshness and provenance alone should not carry metadata-only workflow wrappers into medium value.
  - Temp fixtures, worktrees, generated outputs, OS junk, empty markers, metadata-only observations, and non-representative duplicates receive multiplicative discounts.
  - Pair and bundle synergy scores must expose their evidence and missing assumptions.
