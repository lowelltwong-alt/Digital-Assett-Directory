name: dad-contract-check

# DAD lifecycle contract check. Mode comes from the reviewed policy registry
# (registry/contract-check-policy.json): warn during probation, enforce after
# promotion. The job stays continue-on-error + non-required while on probation;
# promoting to a required check is a separate reviewed branch-protection change.

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract-check:
    name: dad-contract-check-advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - name: Run contract check in registry policy mode
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python scripts/contract_check.py --hub . --repo . \
            --base "origin/${{ github.base_ref }}" --mode policy \
            --extra-text-env PR_BODY
