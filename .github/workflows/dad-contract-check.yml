name: dad-contract-check

# Warn-only DAD lifecycle contract check (probation).
# Flags PRs whose protected-path changes carry no DAD-Session trailer or
# DAD-Bypass. Never blocks: continue-on-error + non-required check.
# Policy, promotion criteria, and kill criteria: registry/contract-check-policy.json.

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract-check:
    name: dad-contract-check-advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - name: Run warn-only contract check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python scripts/contract_check.py --hub . --repo . \
            --base "origin/${{ github.base_ref }}" --mode warn \
            --extra-text-env PR_BODY
