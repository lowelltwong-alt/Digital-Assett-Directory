name: rust-ci-pr

on:
  workflow_call:

jobs:
  rust-pr:
    name: rust-pr-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ""
      - name: cargo fmt
        run: cargo fmt --manifest-path tools/dad_scan_core/Cargo.toml --check
      - name: cargo check
        run: cargo check --manifest-path tools/dad_scan_core/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path tools/dad_scan_core/Cargo.toml --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path tools/dad_scan_core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Python wrapper help
        run: python scripts/run_dad_scan_core.py --help
      - name: Python Rust bridge tests
        run: python -m pytest tests/test_rust_bridge_dad_scan_core.py tests/test_rust_rollout.py -q
