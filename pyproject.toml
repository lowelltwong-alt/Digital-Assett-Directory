[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-asset-directory"
version = "0.1.0"
description = "Local-first digital asset catalog, graph, orphan/activation/synergy radar, and governed learning hub."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Lowell T. Wong"}]
dependencies = [
  "networkx>=3.2,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pathspec>=0.12,<1",
  "jsonschema>=4.22,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0,<7",
  "types-requests>=2.32,<3",
  "nox>=2024.4.15",
  "pytest-testmon>=2.1",
  "pytest-picked>=0.5",
  "pytest-xdist>=3.6"
]

[project.scripts]
asset-dir = "digital_asset_directory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
filterwarnings = [
  "ignore:GitWildMatchPattern:DeprecationWarning",
]
markers = [
  "unit: fast, pure-logic tests with no filesystem, sqlite, or network",
  "integration: tests that touch the filesystem, sqlite, or the full pipeline",
  "network: tests that reach external services (GitHub); deselected by default",
  "slow: long-running tests; deselect with -m 'not slow'",
  "proposals: proposal-engine tests",
  "calibration: calibration-workflow tests",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
