roadmap_version: 0.1.0
namespace: DAD-ROADMAP-SEED
status_model:
  - planned
  - active
  - awaiting_human_gate
  - awaiting_validation_evidence
  - boundary_deferred
  - blocked
  - complete
phases:
  - id: phase-0-seed
    title: Seed scaffold and governed front door
    status: complete
    acceptance:
      required_files:
        - AI_FRONT_DOOR.md
        - AGENTS.md
        - MACHINE_NAVIGATION_MANIFEST.json
        - registry/source-of-truth.json
        - schemas/asset.schema.json
        - src/digital_asset_directory/cli.py
        - tests/test_ids.py
      commands:
        - python -m pytest
        - python -m digital_asset_directory.cli validate
    evidence_note: Package generation and local tests must be reported separately; status does not claim a user-machine scan.

  - id: phase-1-first-inventory
    title: First reviewed bounded local inventory
    status: complete
    acceptance:
      required_files:
        - roadmap/evidence/phase-1-first-inventory.md
      required_outputs:
        - processed/catalog/assets.jsonl
        - processed/graph/graph.json
        - processed/reports/scan_summary.md
        - processed/alerts/alert_inbox.md
      human_gates:
        - id: phase-1-source-scope-reviewed
          description: sources.local.yaml reviewed for excluded sensitive paths
        - id: phase-1-github-token-scope-reviewed-deferred
          description: GitHub token scope reviewed and GitHub scanning deferred
        - id: phase-1-source-mutation-check-passed
          description: source mutation and changed-during-scan summary reviewed

  - id: phase-1.5-scoring-discipline-clean-sampling
    title: Scoring discipline and clean calibration sampling
    status: complete
    acceptance:
      required_files:
        - docs/ASSET_VALUE_MODEL.md
        - docs/ALGORITHM_CALIBRATION_AND_FIXES_HANDOFF.md
        - roadmap/evidence/phase-1.5-scoring-discipline.md
      required_outputs:
        - processed/reports/quarantine_summary.md
        - processed/reports/asset_rating_calibration_summary.md
      human_gates:
        - id: phase-1.5-noise-quarantine-reviewed
          description: scanner noise excludes and quarantine summary reviewed
        - id: phase-1.5-score-methodology-reviewed
          description: score methodology and discount metadata reviewed
        - id: phase-1.5-clean-calibration-sample-reviewed
          description: clean deduped calibration sample regenerated and reviewed

  - id: phase-2-calibration
    title: Calibrate value, staleness, orphan, and synergy scoring
    status: complete
    acceptance:
      depends_on:
        - phase-1.5-scoring-discipline-clean-sampling
      required_outputs:
        - processed/reports/scoring_calibration.md
        - processed/reports/orphan_review_sample.md
        - processed/reports/synergy_review_sample.md
      human_gates:
        - id: phase-2-asset-ratings-reviewed
          description: at least 50 reviewed asset ratings
        - id: phase-2-false-positive-negative-notes-captured
          description: false-positive and false-negative notes captured
        - id: phase-2-weight-changes-documented
          description: weight changes documented

  - id: phase-2.5-content-aware-score-validation
    title: Fresh content-aware score validation
    status: complete
    acceptance:
      depends_on:
        - phase-2-calibration
      required_files:
        - config/scoring.yaml
        - docs/ASSET_VALUE_MODEL.md
        - roadmap/evidence/phase-2.5-content-aware-scoring.md
      required_outputs:
        - processed/reports/scan_summary.md
        - processed/reports/phase_2_5_score_delta_validation.md
        - processed/reports/phase_2_5_score_delta_validation.json
    evidence_note: Validates asset-value-v0.3-content-aware against the 100 reviewed Phase 2 rows after a fresh local-only scan; scores remain candidate heuristics.

  - id: phase-3-downstream-governance
    title: Sandbox downstream governance pilot; active repo install deferred
    status: complete
    acceptance:
      depends_on:
        - phase-2.5-content-aware-score-validation
      human_gates:
        - id: phase-3-pilot-repositories-selected
          description: pilot repositories selected
        - id: phase-3-pre-push-enforcement-reviewed
          description: pre-push enforcement reviewed
        - id: phase-3-lessons-arrive-central-hub
          description: lessons arrive in central hub
        - id: phase-3-bypass-failure-tested
          description: bypass and failure behavior tested

  - id: phase-4-semantic-enrichment
    title: Semantic enrichment boundary; embeddings and AI-assisted enrichment deferred
    status: boundary_deferred
    acceptance:
      required_files:
        - roadmap/evidence/phase-4-semantic-enrichment.md
      human_gates:
        - id: phase-4-provider-privacy-boundary-approved
          description: provider and privacy boundary approved
        - id: phase-4-deterministic-baseline-retained
          description: deterministic baseline retained
        - id: phase-4-evaluation-harness-benefit-shown
          description: evaluation harness shows measurable benefit
        - id: phase-4-generated-metadata-candidate-status
          description: generated metadata remains candidate status

  - id: phase-5-alerting-and-research-radar
    title: Manual alerting and research radar boundary; scheduled external research deferred
    status: boundary_deferred
    acceptance:
      required_files:
        - roadmap/evidence/phase-5-alerting-and-research-radar.md
      human_gates:
        - id: phase-5-alert-channels-approved
          description: alert channels approved
        - id: phase-5-rate-limits-source-terms-reviewed
          description: rate limits and source terms reviewed
        - id: phase-5-external-code-review-gates-active
          description: external code review gates active
        - id: phase-5-no-autonomous-merge-promotion
          description: no autonomous merge or promotion path

  - id: phase-6-exceptions-lake-and-capture-completeness
    title: Exceptions lake and deterministic cross-repo capture completeness
    status: active
    acceptance:
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - docs/DAD_EXCEPTIONS_LAKE_BUILDOUT.md
        - schemas/exception-event.schema.json
        - schemas/exception-fix-outcome.schema.json
        - schemas/exception-capture-pattern-registry.schema.json
        - schemas/exception-capture-scenarios.schema.json
        - registry/exception-event-type-registry.json
        - registry/exception-learning-methodology.json
        - registry/exception-capture-pattern-registry.json
        - assets/coding-harnesses/exception-capture-completeness/examples/synthetic-capture-scenarios.json
        - templates/downstream/EXCEPTIONS_README.md
      required_outputs:
        - processed/exceptions/lake/events.jsonl
        - processed/reports/exceptions_lake.json
        - processed/reports/exception_capture_completeness.json
        - processed/reports/exception_capture_emission_simulation.json
        - processed/reports/exception_taxonomy_coverage.json
        - processed/reports/exception_capture_observed_audit.json
        - processed/reports/phase6_exception_capture_machine_evidence_summary.json
      human_gates:
        - id: phase-6-capture-completeness-harness-reviewed
          description: synthetic harness proves DAD-worthy patterns become mail or exception packets without human chat intervention
        - id: phase-6-lawfirm-intake-missed-capture-regression
          description: LawFirm-os-intake review issue mail dad:mail:ac201c5e-4f51-5fc2-ac9f-ddc7d45a79f1 is a golden regression for automatic capture
        - id: phase-6-pattern-update-simulation-reviewed
          description: updated DAD needs, offerings, exception taxonomy, and downstream templates cause enrolled repos to emit new required packet fields
        - id: phase-6-all-asset-pattern-coverage-reviewed
          description: asset, harness, skill, template, workflow, architecture, governance, data-map, mail, exception, review, fix, and learning-loop patterns have synthetic expected-send tests
        - id: phase-6-sensitive-payload-negative-tests-reviewed
          description: synthetic secrets, raw private data, hidden reasoning, long logs, real-case rows, and prompt-injection-like text are blocked or quarantined
        - id: phase-6-observed-repo-capture-audit-reviewed
          description: observed repo audit checks real mail, exception, and fix-outcome outboxes plus path signals for missed emissions without mutating target repos
        - id: phase-6-taxonomy-route-coverage-reviewed
          description: every reviewed learnable exception event type has an explicit route classification across direct record, capture-rule, backfill, or unrouted status
    evidence_note: Historical repos may have missed DAD-worthy exceptions before the new enrollment/capture surface existed; evidence must distinguish expected legacy misses from current capture failures.

  - id: phase-7-language-frontier-and-rust-core
    title: Language frontier radar and DAD-first Rust scan core
    status: planned
    acceptance:
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - docs/RESEARCH_INTAKE_PIPELINE.md
        - docs/LANGUAGE_CODING_ADVANTAGE.md
        - registry/trusted-source-registry.json
        - registry/language-coding-advantage-registry.json
        - registry/coding-harness-registry.json
        - assets/coding-harnesses/language-frontier-research/harness.json
        - assets/coding-harnesses/language-frontier-research/tests-or-evals/minimum-eval.json
        - assets/rust-buildout-guide/rust-buildout.json
        - assets/python-underused-idioms/idioms.json
        - assets/dad-rust-upgrade-starter-pack/manifest.json
        - tools/dad_scan_core/Cargo.toml
        - tools/dad_scan_core/src/lib.rs
        - src/digital_asset_directory/rust_bridge/dad_scan_core.py
        - src/digital_asset_directory/rust_rollout/policy.py
        - docs/rust/DAD_RUST_SCAN_CORE.md
        - docs/rust/DAD_FORCED_RUST_ROLLOUT_POLICY.md
        - config/repo_rust_status.yaml
        - config/rust_rollout_policy.yaml
        - lessons/rust_rollout/lesson_ledger.jsonl
      human_gates:
        - id: phase-7-rust-starter-pack-reviewed
          description: dad-rust-upgrade-starter-pack.zip manifest, license/provenance, security, and overlay map reviewed before any crate files are installed
        - id: phase-7-dad-scan-core-overlay-approved
          description: tools/dad_scan_core overlay approved with cargo fmt, clippy, test, Python wrapper, and public/private path handling plan
        - id: phase-7-language-frontier-source-cadence-reviewed
          description: Rust and Python frontier source cadences, source terms, and pointer-only intake boundaries reviewed
        - id: phase-7-downstream-rust-rollout-boundary-reviewed
          description: non-Logos rollout remains candidate mail by default; Logos local writes require explicit separate approval
    evidence_note: The starter pack is preserved under assets and the DAD-local dad_scan_core overlay is installed with a Python bridge, rollout policy, local mail packet builder, and lesson ledger. Broader downstream rollout remains gated; DAD must prove profile/parity value before recommending Rust in downstream repos.

  - id: phase-8-dad-local-deployment
    title: Local DAD deployment and hub resolution
    status: awaiting_human_gate
    acceptance:
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - roadmap/evidence/phase-8-dad-local-deployment.md
        - roadmap/evidence/phase-8-dad-local-deployment.commands.json
        - AGENTS.md
        - AI_FRONT_DOOR.md
      commands:
        - python -m pytest tests/test_dad_local_deployment.py -q
        - python -m digital_asset_directory.cli doctor --hub . --scope deployment
        - user-shim asset-dir doctor --scope deployment from two non-DAD repos
        - user-shim asset-dir doctor --scope deployment from Mock Trial4.26 and LawFirm-os-intake without target worktree changes
        - user-shim asset-dir agent preflight --repo . --agent codex --task "Goal 1 deployment smoke from outside DAD"
      human_gates:
        - id: phase-8-local-install-reviewed
          description: DAD can be installed or wrapped so asset-dir works from outside the DAD checkout without manual PYTHONPATH knowledge
        - id: phase-8-hub-locator-reviewed
          description: --hub, DAD_HUB, and user-level hub config resolve the same canonical DAD hub from non-DAD repos
        - id: phase-8-doctor-smoke-reviewed
          description: asset-dir doctor passes from DAD and at least two non-DAD repos
        - id: phase-8-unavailable-policy-reviewed
          description: unavailable DAD warns for ordinary local coding and fails closed for cross-repo writes, protected repo work, public release, and sensitive mail
    evidence_note: This phase proves DAD is reachable as a local tool before any broad repo enrollment or daily recurring operation is trusted.

  - id: phase-9-all-repo-read-only-inventory
    title: All-repo read-only inventory and classification proof
    status: planned
    acceptance:
      depends_on:
        - phase-8-dad-local-deployment
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - roadmap/evidence/phase-9-all-repo-read-only-inventory.md
        - docs/DAD_REPO_ENROLLMENT.md
      human_gates:
        - id: phase-9-inventory-scope-reviewed
          description: GitHub-visible repos, local Git roots, reviewed policies, and existing contracts are reconciled without writing to target repos
        - id: phase-9-classification-reviewed
          description: repos are classified as enroll, protected-central-only, active-no-write, side-project, archive-ignore, duplicate-ignore, or needs-human-classification
        - id: phase-9-protected-active-rules-reviewed
          description: Logos Scripture Graph and Logos Governance remain protected-central-only while Mock Trial/Albert is active but not extra-protected
        - id: phase-9-public-safe-report-reviewed
          description: public-facing inventory output does not expose local absolute paths unless explicitly approved
    evidence_note: This phase answers whether DAD understands the whole repo world before it is allowed to mutate any repo.

  - id: phase-10-mail-end-to-end-trial
    title: End-to-end DAD mail trial across synthetic repos
    status: planned
    acceptance:
      depends_on:
        - phase-8-dad-local-deployment
        - phase-9-all-repo-read-only-inventory
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - roadmap/evidence/phase-10-mail-end-to-end-trial.md
        - docs/MAIL_CENTER.md
      human_gates:
        - id: phase-10-two-repo-mail-harness-reviewed
          description: temp repo A sends mail, DAD collects/routes/dedupes it, and temp repo B receives candidate inbox mail
        - id: phase-10-mailbox-write-boundary-reviewed
          description: delivery writes only .digital-asset/mail paths unless a separate enrollment approval exists
        - id: phase-10-private-public-release-reviewed
          description: private, internal, restricted, or unknown source mail to public-facing target is quarantined until human release
        - id: phase-10-duplicate-delivery-reviewed
          description: duplicate mail delivery becomes acknowledgement/archive evidence and does not spam target inboxes
    evidence_note: This phase tests the repo nervous system before real repo waves depend on mail.

  - id: phase-10a-mailbox-event-pipeline
    title: Mailbox-backed event/data pipeline design and proof
    status: planned
    acceptance:
      depends_on:
        - phase-8-dad-local-deployment
        - phase-9-all-repo-read-only-inventory
        - phase-10-mail-end-to-end-trial
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - roadmap/evidence/phase-10a-mailbox-event-pipeline.md
        - docs/MAIL_CENTER.md
        - docs/DAD_EVENT_PIPELINE.md
        - schemas/dad-pipeline-event.schema.json
        - templates/downstream/MAIL_README.md
      human_gates:
        - id: phase-10a-event-contract-reviewed
          description: repo-local event outbox, central event log, provenance, dedupe, quarantine, and response-state contracts are reviewed
        - id: phase-10a-mailbox-edge-boundary-reviewed
          description: mailboxes remain safe repo-local edge adapters while DAD event logs become central candidate state
        - id: phase-10a-response-loop-reviewed
          description: actionable notices require explicit repo response events such as acknowledged, saved_for_future, implemented, rejected, deferred, or needs_human_review
        - id: phase-10a-rust-leaf-checker-reviewed
          description: Rust is evaluated only for deterministic leaf validation, scanning, hashing, dedupe, and freshness checks with Python/DAD retaining policy authority
        - id: phase-10a-cloud-boundary-reviewed
          description: any Cloudflare mirror is public-safe metadata only until local-first gates and human release rules are satisfied
    evidence_note: This phase records the pivot from mail-as-system to event pipeline with mailbox presentation, without authorizing cloud deployment or broad repo writes.

  - id: phase-11-dad-library-card-catalog-upgrade
    title: DAD library card catalog and context-pack route upgrade
    status: planned
    acceptance:
      depends_on:
        - phase-8-dad-local-deployment
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - AI_FRONT_DOOR.md
        - AI_TABLE_OF_CONTENTS.md
        - MACHINE_NAVIGATION_MANIFEST.json
        - docs/CODING_HARNESS_LIBRARY.md
      human_gates:
        - id: phase-11-offering-routes-reviewed
          description: important DAD assets, harnesses, skills, templates, Rust assets, mail, exceptions, and enrollment routes have exact AI front-door and TOC entries
        - id: phase-11-context-pack-golden-tasks-reviewed
          description: preflight/context-pack output returns compact, task-relevant recommendations for golden coding, governance, mail, Rust, and enrollment tasks
        - id: phase-11-offering-authority-reviewed
          description: offerings record use_when, do_not_use_when, validation, owner authority, update channel, and adoption semantics
        - id: phase-11-usage-ledger-reviewed
          description: DAD can report which repos use, watch, reject, or depend on DAD assets without treating match scores as proof of value
    evidence_note: This phase makes DAD readable by agents so deployment does not become a scavenger hunt.

  - id: phase-12-reviewed-enrollment-waves
    title: Reviewed enrollment waves for persistent repos
    status: planned
    acceptance:
      depends_on:
        - phase-8-dad-local-deployment
        - phase-9-all-repo-read-only-inventory
        - phase-10-mail-end-to-end-trial
        - phase-10a-mailbox-event-pipeline
        - phase-11-dad-library-card-catalog-upgrade
      required_files:
        - roadmap/evidence/dad-deployment-and-all-repo-verification-roadmap.md
        - docs/DAD_REPO_ENROLLMENT.md
        - templates/downstream/DAD_INTEGRATION.template.json
      human_gates:
        - id: phase-12-wave-policy-reviewed
          description: every repo in a wave appears in reviewed enrollment policy with approval id, visibility, branch, dirty-worktree status, and allowed write paths
        - id: phase-12-apply-boundary-reviewed
          description: enrollment apply/update writes only approved DAD-managed surfaces and preserves local repo authority outside markers
        - id: phase-12-cadence-reviewed
          description: daily mail and weekly asset/skill/template/architecture/governance/data-map checks are configured without heavy preflight work
        - id: phase-12-protected-repo-wave-reviewed
          description: protected Logos repos remain central-only unless explicit repo-specific local-write approval is recorded
        - id: phase-12-rename-copy-split-reviewed
          description: renamed/copied repos preserve stable repo ID where valid, while split repos require new enrollment records
    evidence_note: "This phase is intentionally last: broad enrollment starts only after deployment, inventory, mail, event pipeline, catalog routes, exception capture, and Rust boundaries have evidence."
