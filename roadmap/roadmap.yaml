roadmap_version: 0.1.0
namespace: DAD-ROADMAP-SEED
status_model:
  - planned
  - active
  - blocked
  - complete
phases:
  - id: phase-0-seed
    title: Seed scaffold and governed front door
    status: complete
    acceptance:
      required_files:
        - AI_FRONT_DOOR.md
        - AGENTS.md
        - MACHINE_NAVIGATION_MANIFEST.json
        - registry/source-of-truth.json
        - schemas/asset.schema.json
        - src/digital_asset_directory/cli.py
        - tests/test_ids.py
      commands:
        - python -m pytest
        - python -m digital_asset_directory.cli validate
    evidence_note: Package generation and local tests must be reported separately; status does not claim a user-machine scan.

  - id: phase-1-first-inventory
    title: First reviewed local and GitHub inventory
    status: planned
    acceptance:
      required_outputs:
        - processed/catalog/assets.jsonl
        - processed/graph/graph.json
        - processed/reports/scan_summary.md
        - processed/alerts/alert_inbox.md
      human_gates:
        - sources.local.yaml reviewed for excluded sensitive paths
        - GitHub token scope reviewed
        - source mutation check passed

  - id: phase-2-calibration
    title: Calibrate value, staleness, orphan, and synergy scoring
    status: planned
    acceptance:
      required_outputs:
        - processed/reports/scoring_calibration.md
        - processed/reports/orphan_review_sample.md
        - processed/reports/synergy_review_sample.md
      human_gates:
        - at least 50 reviewed asset ratings
        - false-positive and false-negative notes captured
        - weight changes documented

  - id: phase-3-downstream-governance
    title: Install mandatory lessons and handoffs in active build repos
    status: planned
    acceptance:
      human_gates:
        - pilot repositories selected
        - pre-push enforcement reviewed
        - lessons arrive in central hub
        - bypass and failure behavior tested

  - id: phase-4-semantic-enrichment
    title: Optional embeddings and AI-assisted enrichment
    status: planned
    acceptance:
      human_gates:
        - provider and privacy boundary approved
        - deterministic baseline retained
        - evaluation harness shows measurable benefit
        - generated metadata remains candidate status

  - id: phase-5-alerting-and-research-radar
    title: Scheduled change detection and external missing-part research
    status: planned
    acceptance:
      human_gates:
        - alert channels approved
        - rate limits and source terms reviewed
        - external code review gates active
        - no autonomous merge or promotion path
