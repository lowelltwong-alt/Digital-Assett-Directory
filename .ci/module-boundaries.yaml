schema_version: dad.ci_module_boundaries.v1
capability_id: dad:capability:ci-module-boundary-governance
capability_revision: 0.1.0
repository: {repository_id: dad, owners: [dad-maintainer], default_branch: main}
workflow_paths: [.github/workflows/**, .ci/**]
modules:
  - module_id: python-control-plane
    owners: [dad-maintainer]
    roots: [src, tests, scripts, .codex/hooks/intent_continuity_shadow.py, pyproject.toml, uv.lock]
    triggers:
      - {edge_type: code, paths: [src/**, tests/**, scripts/**, .codex/hooks/intent_continuity_shadow.py]}
      - {edge_type: contract, paths: [pyproject.toml, uv.lock, src/digital_asset_directory/cli.py]}
      - {edge_type: authoritative_input, paths: [src/digital_asset_directory/config.py]}
  - module_id: governance
    owners: [dad-maintainer]
    roots: [registry, schemas, assets, templates, docs, roadmap, config/intent-continuity-shadow-hooks.json, .digital-asset/key-values/change-log.jsonl, .digital-asset/key-values/registry.json, .codex/hooks.json, .gitattributes, AGENTS.md, AI_FRONT_DOOR.md, AI_TABLE_OF_CONTENTS.md, MACHINE_NAVIGATION_MANIFEST.json]
    triggers:
      - {edge_type: code, paths: [assets/**, templates/**]}
      - {edge_type: contract, paths: [registry/**, schemas/**, .digital-asset/key-values/change-log.jsonl, .digital-asset/key-values/registry.json, .codex/hooks.json, .gitattributes, AGENTS.md, AI_FRONT_DOOR.md, AI_TABLE_OF_CONTENTS.md, MACHINE_NAVIGATION_MANIFEST.json]}
      - {edge_type: authoritative_input, paths: [registry/**, schemas/**, docs/**, roadmap/**, config/intent-continuity-shadow-hooks.json]}
  - module_id: rust-scan
    owners: [dad-maintainer]
    roots: [tools/dad_scan_core, src/digital_asset_directory/rust_bridge, src/digital_asset_directory/rust_rollout, docs/rust, templates/rust, deny.toml]
    triggers:
      - {edge_type: code, paths: [tools/dad_scan_core/**, src/digital_asset_directory/rust_bridge/**, src/digital_asset_directory/rust_rollout/**]}
      - {edge_type: contract, paths: [tools/dad_scan_core/Cargo.toml, tools/dad_scan_core/Cargo.lock, deny.toml, templates/rust/**]}
      - {edge_type: authoritative_input, paths: [docs/rust/**]}
dependencies:
  - edge_id: governance-to-python
    from: governance
    to: python-control-plane
    edge_type: direct_dependent
    on: [contract, authoritative_input]
    evidence: Python validation and routing consume DAD registries, schemas, and authority documents.
  - edge_id: rust-to-python
    from: rust-scan
    to: python-control-plane
    edge_type: direct_dependent
    on: [contract]
    evidence: The Python bridge consumes the Rust scan contract.
suites:
  - {suite_id: ci-contract, lane: ci_contract, scope: declared_modules, scope_modules: [], events: [pull_request, push_default_branch], command: "python scripts/validate_ci_module_boundaries.py --repo . validate --provider github-actions"}
  - {suite_id: python-control-plane, lane: module, scope: module, scope_modules: [python-control-plane], events: [pull_request, push_default_branch], command: "python -m pytest"}
  - {suite_id: governance, lane: module, scope: module, scope_modules: [governance], events: [pull_request, push_default_branch], command: "validate and roadmap check"}
  - {suite_id: rust-scan, lane: module, scope: module, scope_modules: [rust-scan], events: [pull_request, push_default_branch], command: "cargo test --manifest-path tools/dad_scan_core/Cargo.toml"}
  - {suite_id: release, lane: release, scope: declared_modules, scope_modules: [python-control-plane, governance, rust-scan], dependency_edges: [governance-to-python, rust-to-python], events: [release], command: "full reviewed release battery"}
  - {suite_id: scheduled-full, lane: scheduled_full_regression, scope: repository, scope_modules: [python-control-plane, governance, rust-scan], events: [schedule, workflow_dispatch], command: "python -m pytest"}
workflows:
  - workflow_id: validate-selector
    provider_path: .github/workflows/validate.yml
    lane: ci_contract
    events: [pull_request, push_default_branch]
    required_check: true
    always_reports: true
    scope: selector
    selector_job: selector
    suite_job_map: {python-control-plane: python, governance: governance, rust-scan: rust}
    required_aggregator_job: validate
    workflow_contract_digest: sha256:95e3a7ebad6c6c296b986d1c79256d54acef0c1e9ba6e90b0ec4c7f488fb2e3d
    job_contract_digests:
      selector: sha256:58255041c47bba2cb881f682e509fe16483593fa353315dba60905d4c65131f0
      python: sha256:3e3b1f1a952197ebc0b53789b4d405dc412656e5d43442f5a0cceb9b8c51ac02
      governance: sha256:3383af32eddc0e53d2262a627b7c8563623edd9e482761b71269fc8b5d24ba64
      rust: sha256:9fcd0b0b653ebf381cad09a5c167b5c2b3b669889861bd444fdfa7e41044fb47
      validate: sha256:8a968878ee7dd02732ff51f504db2be70899c97eb471133fff83475c866b5657
  - {workflow_id: rust-pr, provider_path: .github/workflows/rust-ci-pr.yml, lane: module, events: [workflow_call], required_check: false, always_reports: false, scope: module, workflow_contract_digest: "sha256:ca1889d5dd1c9913dbbff8ab3cdfe11cc77b5f7b6687e7334463c95a3e6ab556"}
  - {workflow_id: rust-long, provider_path: .github/workflows/rust-ci-long.yml, lane: scheduled_full_regression, events: [schedule, workflow_dispatch], required_check: false, always_reports: true, scope: repository, workflow_contract_digest: "sha256:1b8d168ea9d989bbd95930ff4f04c84efb121f557e07741c0a48c3ee4322af49"}
  - {workflow_id: scheduled-full, provider_path: .github/workflows/scheduled-full-regression.yml, lane: scheduled_full_regression, events: [schedule, workflow_dispatch], required_check: false, always_reports: true, scope: repository, workflow_contract_digest: "sha256:05970a4507d42dd4eb8ef803a2dd805db314a9c633befb465424f0233110aa95"}
generated_artifacts:
  - {artifact_id: processed-candidates, module_id: governance, paths: [processed/**], authoritative_inputs: [registry/**, schemas/**]}
exceptions: []
